name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.0)
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build installers
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Validate release tag and versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release.mjs
      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup2.4-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.0-dev \
            rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            src-tauri
      - name: Install Windows deps (NSIS & WiX)
        if: runner.os == 'Windows'
        run: choco install -y nsis wixtoolset
      - name: Install JS deps
        run: npm ci
      - name: Frontend and release regression tests
        run: |
          npm test
          npm run test:release
      - name: Core regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p checksum-core --locked
      - name: Build app bundles with Tauri
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Zip macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          set -e
          APP_DIR=$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -n 1 || true)
          if [ -n "$APP_DIR" ]; then
            ZIP_PATH="${APP_DIR}.zip"
            # Use ditto to preserve macOS bundle metadata
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP_PATH"
            echo "Zipped $APP_DIR -> $ZIP_PATH"
          else
            echo "No .app bundle found to zip"
          fi
      - name: Package portable Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release -Filter checksum.exe -File | Select-Object -First 1
          if ($exe) {
            Compress-Archive -Path $exe.FullName -DestinationPath src-tauri/target/release/CheckSum-portable.zip
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: app-bundles-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.zip
            src-tauri/target/release/CheckSum-portable.zip

  release:
    name: Create GitHub Release (draft)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download all build artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          pattern: app-bundles-*
          path: release-assets
          merge-multiple: false
      - name: Stage unique assets and portable SHA256 checksums
        run: node scripts/release-assets.mjs release-assets release-flat
      - name: Create draft release and attach assets
        uses: softprops/action-gh-release@v2.4.1
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: release-flat/*
