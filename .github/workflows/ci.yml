name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Frontend formatting
        run: npm run format:check
      - name: Regression tests
        run: npm test
      - name: Release manifest tests
        run: npm run test:release
      - name: Typecheck & build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  rust:
    name: Rust build (Tauri backend)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup2.4-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.0-dev
      - name: Install Windows deps (NSIS & WiX)
        if: runner.os == 'Windows'
        run: choco install -y nsis wixtoolset
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            src-tauri
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Core lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p checksum-core --all-targets --locked -- -D warnings
      - name: Native build and regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --features custom-protocol --locked
