[package]
name = "checksum-core"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
blake3 = "1.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
csv = "1.3"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }
